name: MatchCraft AI Automation
on:
  schedule:
    - cron: '30 6,10,13,16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: MatchCraft-AI-cron
  cancel-in-progress: false
jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Exécuter l'Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py
      - name: Sauvegarder les résultats dans le dépôt
        run: |
          git config --global user.name 'MatchCraft-AI-Bot'
          git config --global user.email 'bot@github.com'

          # 1. On indexe les données ET les fichiers générés (CV/lettres)
          git add data/ output/

          # 2. On valide les changements localement s'il y en a
          git commit -m "Auto-update des offres [skip ci]" || exit 0

          # 3. On réaligne avec la branche distante APRÈS le commit (arbre de travail propre)
          git pull --rebase origin main

          # 4. On pousse le commit
          git push
