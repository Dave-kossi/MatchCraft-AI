name: MatchCraft AI - Cron

on:
  schedule:
    # 08:30 / 12:30 / 15:30 / 18:30 heure de Paris ≈ 06:30 / 10:30 / 13:30 / 16:30 UTC (CEST, été)
    # ⚠️ décalage de -1h en hiver (CET) — GitHub Actions ne gère pas le fuseau automatiquement
    - cron: "30 6,10,13,16 * * *"
  workflow_dispatch:  # permet de lancer manuellement depuis l'onglet Actions

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer MatchCraft AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit et push des résultats
        run: |
          git config user.name "MatchCraft Bot"
          git config user.email "bot@matchcraft.local"
          git add data/historique.json data/offres_rejetees.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Mise à jour automatique des offres"
          git push
