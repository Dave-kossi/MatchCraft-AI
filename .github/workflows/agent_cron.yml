name: MatchCraft AI - Cron

on:
  schedule:
    - cron: "30 6,10,13,16 * * *"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer MatchCraft AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Commit et push des résultats
        run: |
          git config user.name "MatchCraft Bot"
          git config user.email "bot@matchcraft.local"
          git add data/historique.json data/offres_rejetees.json
          
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "🤖 Mise à jour automatique des offres [skip ci]"
            git push
          else
            echo "Aucun changement à enregistrer."
          fi
